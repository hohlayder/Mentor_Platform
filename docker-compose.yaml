services:
  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      - ENV=development
      - PORT=${API_GATEWAY_PORT}
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - USER_SERVICE_URL=user-service:${USER_SERVICE_PORT}
      - CHAT_SERVICE_URL=chat-service:${CHAT_SERVICE_PORT}
      - AUTH_SERVICE_URL=auth-service:${AUTH_SERVICE_PORT}
      - SESSION_SERVICE_URL=session-service:${SESSION_SERVICE_PORT}
      - POST_SERVICE_URL=post-service:${POST_SERVICE_PORT}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    depends_on:
      - redis
      - user-service
      - chat-service
      - auth-service
      - session-service
      - post-service
    volumes:
      - uploads_data:/root/uploads
    networks:
      - ${NETWORK_NAME:-my-app-network}

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - ${NETWORK_NAME:-my-app-network}

  user-db:
    image: postgres:15-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${USER_DB_PORT}:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    networks:
      - ${NETWORK_NAME:-my-app-network}
    restart: unless-stopped

  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - ${NETWORK_NAME:-my-app-network}
    restart: unless-stopped

  chat-db:
    image: postgres:15-alpine
    container_name: chat-db
    environment:
      POSTGRES_DB: ${CHAT_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${CHAT_DB_PORT}:5432"
    volumes:
      - chat_data:/var/lib/postgresql/data
    networks:
      - ${NETWORK_NAME:-my-app-network}
    restart: unless-stopped

  session-db:
    image: postgres:15-alpine
    container_name: session-db
    environment:
      POSTGRES_DB: ${SESSION_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${SESSION_DB_PORT}:5432"
    volumes:
      - session_data:/var/lib/postgresql/data
    networks:
      - ${NETWORK_NAME:-my-app-network}
    restart: unless-stopped

  post-db:
    image: postgres:15-alpine
    container_name: post-db
    environment:
      POSTGRES_DB: ${POST_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POST_DB_PORT}:5432"
    volumes:
      - post_data:/var/lib/postgresql/data
    networks:
      - ${NETWORK_NAME:-my-app-network}
    restart: unless-stopped
  notification-db:
    image: postgres:15-alpine
    container_name: notification-db
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${NOTIFICATION_DB_PORT}:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    networks:
      - ${NETWORK_NAME:-my-app-network}
  user-service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      - DB_HOST=user-db
      - DB_PORT=5432
      - DB_NAME=${USER_DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GRPC_PORT=${USER_SERVICE_PORT}
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    depends_on:
      - user-db
    networks:
      - ${NETWORK_NAME:-my-app-network}

  auth-service:
    build:
      context: ./auth_service
    container_name: auth-service
    environment:
      - DB_HOST=auth-db
      - DB_PORT=5432
      - DB_NAME=${AUTH_DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GRPC_PORT=${AUTH_SERVICE_PORT}
      - USER_SERVICE_ADDR=user-service:${USER_SERVICE_PORT}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    depends_on:
      - auth-db
      - user-service
    networks:
      - ${NETWORK_NAME:-my-app-network}

  chat-service:
    build:
      context: ./chat_service
      dockerfile: Dockerfile
    container_name: chat-service
    environment:
      - DB_HOST=chat-db
      - DB_PORT=5432
      - DB_NAME=${CHAT_DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - USER_SERVICE_URL=user-service:${USER_SERVICE_PORT}
      - GRPC_PORT=${CHAT_SERVICE_PORT}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=1
      - REDIS_CHANNEL=chat_messages
      - REDIS_URL=redis:6379
      - GMAIL_EMAIL=${GMAIL_EMAIL}
    ports:
      - "${CHAT_SERVICE_PORT}:${CHAT_SERVICE_PORT}"
    depends_on:
      - chat-db
      - redis
      - kafka
    networks:
      - ${NETWORK_NAME:-my-app-network}

  session-service:
    build:
      context: ./session_service
      dockerfile: Dockerfile
    container_name: session-service
    environment:
      - DB_HOST=session-db
      - DB_PORT=5432
      - DB_NAME=${SESSION_DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GRPC_PORT=${SESSION_SERVICE_PORT}
      - SESSION_SERVICE_ADDR=session-service:${SESSION_SERVICE_PORT}
      - USER_SERVICE_URL=user-service:${USER_SERVICE_PORT}
    ports:
      - "${SESSION_SERVICE_PORT}:${SESSION_SERVICE_PORT}"
    depends_on:
      - session-db
      - user-service
    networks:
      - ${NETWORK_NAME:-my-app-network}

  post-service:
    build:
      context: ./post_service
      dockerfile: Dockerfile
    container_name: post-service
    environment:
      - DB_HOST=post-db
      - DB_PORT=5432
      - DB_NAME=${POST_DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GRPC_PORT=${POST_SERVICE_PORT}
    ports:
      - "${POST_SERVICE_PORT}:${POST_SERVICE_PORT}"
    depends_on:
      - post-db
      - post-migrate
    networks:
      - ${NETWORK_NAME:-my-app-network}

  frontend:
    build: ./frontend
    container_name: frontend-app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api-gateway:8080/api/v1
      - CHOKIDAR_USEPOLLING=true
      - VITE_HOST=0.0.0.0
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - api-gateway
    networks:
      - ${NETWORK_NAME:-my-app-network}

  user-migrate:
    image: migrate/migrate:v4.16.2
    depends_on:
      - user-db
    volumes:
      - ./user_service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@user-db:5432/${USER_DB_NAME}?sslmode=disable"
      - "up"
    networks:
      - ${NETWORK_NAME:-my-app-network}

  auth-migrate:
    image: migrate/migrate:v4.16.2
    depends_on:
      - auth-db
    volumes:
      - ./auth_service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME}?sslmode=disable"
      - "up"
    networks:
      - ${NETWORK_NAME:-my-app-network}

  chat-migrate:
    image: migrate/migrate:v4.16.2
    depends_on:
      - chat-db
    volumes:
      - ./chat_service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@chat-db:5432/${CHAT_DB_NAME}?sslmode=disable"
      - "up"
    networks:
      - ${NETWORK_NAME:-my-app-network}

  session-migrate:
    image: migrate/migrate:v4.16.2
    depends_on:
      - session-db
    volumes:
      - ./session_service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@session-db:5432/${SESSION_DB_NAME}?sslmode=disable"
      - "up"
    networks:
      - ${NETWORK_NAME:-my-app-network}

  post-migrate:
    image: migrate/migrate:v4.16.2
    depends_on:
      - post-db
    volumes:
      - ./post_service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@post-db:5432/${POST_DB_NAME}?sslmode=disable"
      - "up"
    networks:
      - ${NETWORK_NAME:-my-app-network}
  
  notification-migrate:
    image: migrate/migrate:v4.16.2
    depends_on:
      - notification-db
    volumes:
      - ./notification_service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@notification-db:5432/${NOTIFICATION_DB_NAME}?sslmode=disable"
      - "up"
    networks:
      - ${NETWORK_NAME:-my-app-network}

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ${NETWORK_NAME:-my-app-network}

  kafka:
    image: wurstmeister/kafka:latest 
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CREATE_TOPICS: "chat_messages:3:1,book_event:3:1"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT

    ports:
      - "29092:29092"
      - "9092:9092"
    volumes:
    - kafka_data:/kafka
    networks:
      - ${NETWORK_NAME:-my-app-network}

  notification-service:
    build:
      context: ./notification_service
      dockerfile: Dockerfile
    container_name: notification-service
    depends_on:
      - notification-db
      - kafka
    environment:
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_NAME: ${NOTIFICATION_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_CHAT_MESSAGES: chat_messages
      KAFKA_GROUP_ID: notification-service-group
      KAFKA_AUTO_OFFSET_RESET: earliest

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      GMAIL_EMAIL: ${GMAIL_EMAIL:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}

      LOG_LEVEL: debug
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    volumes:
      - ./notification_service/config:/app/config:ro
      - ./notification_service/migrations:/app/migrations:ro
    networks:
      - ${NETWORK_NAME:-my-app-network}

volumes:
  redis_data:
  user_data:
  auth_data:
  chat_data:
  session_data:
  post_data:
  notification_data:
  kafka_data:

networks:
  my-app-network:
    driver: bridge
