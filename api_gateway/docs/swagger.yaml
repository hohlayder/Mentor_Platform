host: localhost:8080
info:
  contact: {}
  description: API Gateway для Mentor Platform
  title: Mentor Platform API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Аутентификация пользователя и получение токенов
      parameters:
      - description: Учетные данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
      summary: Вход в систему
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Инвалидация refresh токена
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.LogoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
      summary: Выход из системы
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Получение новой пары access/refresh токенов
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.RefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
      summary: Обновление токена
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создание нового аккаунта пользователя
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /chats:
    get:
      description: Возвращает список чатов пользователя с последними сообщениями
      parameters:
      - default: 20
        description: Лимит чатов
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.GetUserChatsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить чаты пользователя
      tags:
      - chats
    post:
      consumes:
      - application/json
      description: Создает новый чат между двумя пользователями
      parameters:
      - description: Данные для создания чата
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.CreateChatRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.CreateChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать чат
      tags:
      - chats
  /chats/{id}:
    get:
      description: Возвращает информацию о чате по его идентификатору
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.GetChatByIdResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить чат по ID
      tags:
      - chats
  /chats/messages:
    get:
      description: Возвращает сообщения чата с пагинацией
      parameters:
      - description: ID чата
        in: query
        name: chat_id
        required: true
        type: string
      - default: 50
        description: Лимит сообщений
        in: query
        name: limit
        type: integer
      - description: Курсор для пагинации
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.GetChatMessagesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить сообщения чата
      tags:
      - chats
  /chats/messages/read:
    post:
      consumes:
      - application/json
      description: Помечает указанные сообщения как прочитанные
      parameters:
      - description: ID сообщений
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.MarkMessagesReadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.MarkMessagesReadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Пометить сообщения как прочитанные
      tags:
      - chats
  /profiles/{id}:
    get:
      description: Возвращает полную информацию о профиле пользователя включая менторские/студенческие
        данные
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_domain.ProfileResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_hohlayder_Mentor_Platform_api_gateway_internal_utils.ErrorResponse'
      summary: Получить профиль
      tags:
      - profiles
    put:
